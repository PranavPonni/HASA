Dataset:
  data_dir: /root/motionlearning/data_server/motion/rugby_rotation
  modality:
    tactile_index_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    tactile_thumb_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_pos: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_vel: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
  sequence_length: 200
  shift_data: 1
  test_data:
    - episode0
    - episode6
    - episode12
    - episode18
    - episode24
    - episode30
    - episode36
    - episode42
    - episode48
    - episode54
    - episode60
  param_file_dir: /root/motionlearning/parameter/sat_diff_pos/parameter_base

Model:
  model: sat_diff_pos
  model_name: sat_diff_pos
  model_save_path: /root/motionlearning/model_weight/sat_diff_pos/parameter_base
  dexwild_arch: diff
  use_selftouch: true
  scale_selftouch_with_pretrained: true
  hand_dim: 8
  tactile_dim: 90
  selftouch_input_dim: 16
  selftouch_joint_indices: [0, 1, 2, 3, 12, 13, 14, 15]
  st_param: /root/motionlearning/parameter/selftouch_fcn_pos/zesty-sweep-2/parameter.yaml
  st_model: /root/motionlearning/model_weight/selftouch_fcn_pos/zesty-sweep-2/epoch299.pth
  st_scaling_param: /root/motionlearning/parameter/selftouch_fcn_pos/zesty-sweep-2/scaling_param.pkl
  d_model: 128
  nhead: 4
  encoder_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  max_seq_len: 256
  causal: true
  use_velocity_input: false
  diffusion_steps: 64
  diffusion_loss_coef: 0.1

Motion: null

Required:
  controller_name: RNN_controller
  model_name: sat_diff_pos

Test:
  loss_coef: &loss_coef
    tactile_index_tip: 1.0
    tactile_thumb_tip: 1.0
    hand_jnt_pos: 1.0
    hand_jnt_vel: 1.0
  model_load_path: /root/motionlearning/model_weight/sat_diff_pos/parameter_base/epoch0.pth

Train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  model_save_iter: 25
  eval_every: 1
  num_epochs: 300
  loss_coef: *loss_coef
  cls_rate:
    joint_rate: 0.5
    tactile_rate: 0.5
  noise:
    tactile_noise: 0.01
    joint_noise: 0.01
  project: sat_diff_pos
  wandb_entity: hasa-handresearch-waseda-university
  wandb_watch: false
  wandb_watch_log: gradients
  wandb_watch_freq: 100

Pretrain: null

Sweep:
  tune:
    Model:
      d_model:
        values: [128, 256]
      diffusion_loss_coef:
        values: [0.05, 0.1, 0.25]
    Train:
      lr:
        values: [0.0001, 0.0003]
      batch_size:
        values: [4, 8, 16]
  method: random
  metric:
    name: best_total_loss
    goal: minimize
  project: sat_diff_pos
  wandb_entity: hasa-handresearch-waseda-university

