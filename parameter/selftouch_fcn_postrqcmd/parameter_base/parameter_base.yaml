Dataset:
  data_dir: /root/motionlearning/data_server/selftouch_all
  modality:
    tactile_index_tip:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    tactile_thumb_tip:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    tactile_middle_tip:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    tactile_ring_tip:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    hand_jnt_pos:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    hand_jnt_trq:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
    hand_jnt_cmd_pos:
    - n
    - each
    - - 0.1
      - 0.9
    - timestep dimension -> timestep dimension
  sequence_length: 400
  shift_data: 1
  test_split_policy: blocked_tail
  test_split_fraction: 0.2
  allow_missing_timesteps: false
  combinations:
  - thumb-index
  - thumb-middle
  - index-middle
  test_data:
  - thumb_index_episode0
  - thumb_middle_episode0
  - index_middle_episode0
  - thumb_index_episode20
  - thumb_middle_episode20
  - index_middle_episode20
  - thumb_index_episode40
  - thumb_middle_episode40
  - index_middle_episode40
Model:
  hand_dim: 16
  use_joint_pos_only: true
  tactile_dim: 90
  rec_dim: 128
  dropout: 0.2
  model: selftouch_fcn_postrqcmd
  input_modalities:
  - hand_jnt_pos
  - hand_jnt_trq
  - hand_jnt_cmd_pos
  model_name: selftouch_fcn_postrqcmd
  architecture: encoder_decoder_mlp
  hidden_dim: 128
  encoder_dim: 64
  decoder_dim: 64
  decoder_out_dim: 188
Motion: null
Required:
  controller_name: RNN_controller
  model_name: selftouch_fcn_postrqcmd
Test:
