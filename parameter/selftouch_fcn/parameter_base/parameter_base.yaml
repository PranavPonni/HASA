Dataset:
  data_dir: /root/motionlearning/data_server/selftouch_all
  modality:
    tactile_index_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    tactile_thumb_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    tactile_middle_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep
        dimension"]
    tactile_ring_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_pos: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_vel: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_trq: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_cmd_pos: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
  sequence_length: 400
  shift_data: 1
  test_split_policy: blocked_tail
  test_split_fraction: 0.2
  allow_missing_timesteps: false
  combinations:
  - thumb-index
  - thumb-middle
  - index-middle
  test_data:
  - thumb_index_episode0
  - thumb_middle_episode0
  - index_middle_episode0
  - thumb_index_episode20
  - thumb_middle_episode20
  - index_middle_episode20
  - thumb_index_episode40
  - thumb_middle_episode40
  - index_middle_episode40

Model:
  hand_dim: 16
  use_joint_pos_only: true
  tactile_dim: 90
  rec_dim: 1024
  dropout: 0.0
  model: selftouch_fcn

Motion:

Required:
  controller_name: RNN_controller
  model_name: selftouch_fcn

Test:
  loss_coef: &selftouch_fcn_loss
    tactile_index_tip: 1.5
    tactile_thumb_tip: 1.0
    tactile_middle_tip: 2.5
    tactile_loss: mae
    tactile_spread_mae_weight: 0.75
    tactile_active_weight: 0.35
    tactile_active_threshold_ratio: 0.08
    tactile_intensity_weight: 0.20
    tactile_intensity_gamma: 2.0
    tactile_contact_weight: 0.0
    tactile_contact_temperature: 0.08
    tactile_peak_weight: 0.35
    tactile_profile_weight: 0.15
    tactile_derivative_weight: 0.75
    tactile_curvature_weight: 0.45
    tactile_shape_weight: 0.25
    tactile_highpass_weight: 0.75
    tactile_highpass_kernel: 9
    tactile_temporal_std_weight: 0.35
    tactile_delta_std_weight: 0.35
    tactile_fair_loss: false
    tactile_curve_loss: false
    tactile_level_weight: 0.3
    tactile_amplitude_weight: 0.2
    tactile_corr_weight: 0.1
    tactile_batch_profile_weight: 0.1
    tactile_centered_profile_weight: 0.05
    tactile_topk_weight: 0.30
    tactile_taxel_profile_weight: 0.35
    tactile_temporal_profile_weight: 0.25
    tactile_initial_weight: 1.0
    contrastive: 0.0
    classification: 0.0
  model_load_path: 
    /root/motionlearning/model_weight/selftouch_fcn/parameter_base/epoch0.pth

Train:
  batch_size: 8
  lr: 5e-05
  lr_schedule:
    milestones:
    - 250
    - 400
    - 525
    factors:
    - 0.5
    - 0.2
    - 0.05
  model_save_iter: 25
  eval_every: 1
  plot_every: 10
  use_amp: true
  wandb_watch: false
  wandb_watch_log: gradients
  wandb_watch_freq: 100
  num_epochs: 500
  loss_coef: *selftouch_fcn_loss
  project: selftouch_fcn
  wandb_entity: hasa-handresearch-waseda-university

  early_stop_enabled: false
  early_stop_monitor: total_loss
  early_stop_mode: min
  early_stop_patience: 70
  early_stop_min_delta: 0.002
  early_stop_min_epochs: 180
Pretrain:

Sweep:
  tune:
    Model:
      rec_dim:
        values:
        - 512
        - 1024
      dropout:
        values:
        - 0.0
        - 0.05
        - 0.1
    Train:
      batch_size:
        values:
        - 8
      lr:
        distribution: log_uniform_values
        min: 3.0e-05
        max: 1.0e-04
    Dataset:
      sequence_length:
        values:
        - 400
  method: random
  metric:
    name: tactile_line_raw_accuracy
    goal: maximize
  project: selftouch_fcn
  wandb_entity: hasa-handresearch-waseda-university
