Dataset:
  data_dir: /root/motionlearning/data_server/motion/rugby_rotation
  modality:
    tactile_index_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    tactile_thumb_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_pos: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_vel: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
  sequence_length: 200
  shift_data: 1
  test_data:
    - episode0
    - episode6
    - episode12
    - episode18
    - episode24
    - episode30
    - episode36
    - episode42
    - episode48
    - episode54
    - episode60
  param_file_dir: /root/motionlearning/parameter/t_act_pos/parameter_base

Model:
  model: t_act_pos
  model_name: t_act_pos
  model_save_path: /root/motionlearning/model_weight/t_act_pos/parameter_base
  dexwild_arch: act
  use_selftouch: false
  hand_dim: 8
  tactile_dim: 90
  d_model: 128
  nhead: 4
  encoder_layers: 3
  decoder_layers: 3
  dim_feedforward: 512
  dropout: 0.1
  max_seq_len: 256
  causal: true
  use_velocity_input: false

Motion: null

Required:
  controller_name: RNN_controller
  model_name: t_act_pos

Test:
  loss_coef: &loss_coef
    tactile_index_tip: 1.0
    tactile_thumb_tip: 1.0
    hand_jnt_pos: 1.0
    hand_jnt_vel: 1.0
  model_load_path: /root/motionlearning/model_weight/t_act_pos/parameter_base/epoch0.pth

Train:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  model_save_iter: 25
  eval_every: 1
  num_epochs: 300
  loss_coef: *loss_coef
  cls_rate: 0.5
  noise:
    tactile_noise: 0.01
    joint_noise: 0.01
  project: t_act_pos
  wandb_entity: hasa-handresearch-waseda-university
  wandb_watch: false
  wandb_watch_log: gradients
  wandb_watch_freq: 100

Pretrain: null

Sweep:
  tune:
    Model:
      d_model:
        values: [128, 256]
      encoder_layers:
        values: [2, 3, 4]
      decoder_layers:
        values: [2, 3, 4]
    Train:
      lr:
        values: [0.0001, 0.0003, 0.001]
      batch_size:
        values: [8, 16, 32]
  method: random
  metric:
    name: best_total_loss
    goal: minimize
  project: t_act_pos
  wandb_entity: hasa-handresearch-waseda-university

