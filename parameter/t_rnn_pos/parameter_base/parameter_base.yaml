Dataset:
  data_dir: /root/motionlearning/data_server/motion/rugby_rotation
  modality:
    tactile_index_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    tactile_thumb_tip: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_pos: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]
    hand_jnt_vel: ["n", "each", [0.1, 0.9], "timestep dimension -> timestep dimension"]

  sequence_length: 200
  shift_data: 1

  test_data:
    - episode0
    - episode6
    - episode12
    - episode18
    - episode24
    - episode30
    - episode36
    - episode42
    - episode48
    - episode54
    - episode60

  param_file_dir: /root/motionlearning/parameter/t_rnn_pos/parameter_base

Model:
  hand_dim: 8
  tactile_dim: 90
  hid_dim: 256
  model: t_rnn_pos

  # Selftouch scaling params reused from: selftouch_fcn_pos expert-sweep-73 (best_total_loss=0.001862)
  # Ensures identical data normalization as sat_rnn_pos for fair comparison
  st_param: /root/motionlearning/parameter/selftouch_fcn_pos/expert-sweep-73/parameter.yaml

  model_save_path: /root/motionlearning/model_weight/t_rnn_pos/parameter_base
  model_name: t_rnn_pos

Motion: null

Required:
  controller_name: RNN_controller
  model_name: t_rnn_pos

Test:
  loss_coef:
    tactile_index_tip: 1.0
    tactile_thumb_tip: 1.0
    hand_jnt_pos: 1.0
    hand_jnt_vel: 1.0
  model_load_path: /root/motionlearning/model_weight/t_rnn_pos/parameter_base/epoch0.pth

Train:
  batch_size: 16
  lr: 0.0001
  model_save_iter: 25
  eval_every: 1
  plot_every: 10
  use_amp: false
  wandb_watch: false
  wandb_watch_log: gradients
  wandb_watch_freq: 100
  num_epochs: 300

  loss_coef:
    tactile_index_tip: 1.0
    tactile_thumb_tip: 1.0
    hand_jnt_pos: 1.0
    hand_jnt_vel: 1.0

  cls_rate: 0.5
  noise: 0.01

  project: t_rnn_pos
  wandb_entity: hasa-handresearch-waseda-university

Pretrain: null

Sweep:
  tune:
    Model:
      hid_dim:
        values: [128, 256, 512]
    Train:
      lr:
        values: [0.0001, 0.0003, 0.001]
      batch_size:
        values: [8, 16, 32]
      cls_rate:
        values: [0.3, 0.5, 0.7]

  method: random
  metric:
    name: best_total_loss
    goal: minimize

  project: t_rnn_pos
  wandb_entity: hasa-handresearch-waseda-university
