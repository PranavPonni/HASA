Dataset:
  data_dir: /root/motionlearning/data_server/selftouch_all
  modality:
    tactile_index_tip: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    tactile_thumb_tip: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    tactile_middle_tip: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    tactile_ring_tip: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    hand_jnt_pos: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    hand_jnt_vel: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    hand_jnt_trq: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
    hand_jnt_cmd_pos: [rn, each, [0.1, 0.9], timestep dimension -> timestep dimension]
  sequence_length: 400
  shift_data: 1
  test_split_policy: blocked_tail
  test_split_fraction: 0.2
  allow_missing_timesteps: false
  combinations:
  - thumb-index
  - thumb-middle
  - index-middle
  test_data:
  - thumb_index_episode0
  - thumb_middle_episode0
  - index_middle_episode0
  - thumb_index_episode20
  - thumb_middle_episode20
  - index_middle_episode20
  - thumb_index_episode40
  - thumb_middle_episode40
  - index_middle_episode40
  - thumb_index_episode60
  - thumb_middle_episode60
  - index_middle_episode60
  - thumb_index_episode80
  - thumb_middle_episode80
  - index_middle_episode80
  - thumb_index_episode100
  - thumb_middle_episode100
  - index_middle_episode100
  - thumb_index_episode120
  - thumb_middle_episode120
  - index_middle_episode120
  - thumb_index_episode140
  - thumb_middle_episode140
  - index_middle_episode140
  - thumb_index_episode160
  - thumb_middle_episode160
  - index_middle_episode160
  - thumb_index_episode180
  - thumb_middle_episode180
  - index_middle_episode180

Model:
  hand_dim: 16
  input_dim: 16
  use_derived_features: true
  use_joint_pos_only: false
  num_classes: 3
  tactile_dim: 90
  d_model: 256
  encoder_layers: 4
  decoder_layers: 4
  kernel_size: 7
  projection_dim: 128
  dropout: 0.0
  model: selftouch_contrastive_temporal

  use_tactile_history: true
  tactile_history_steps: 5
  tactile_history_fingers:
  - index
  - thumb
  - middle
  temporal_window_steps: 1
Motion:

Required:
  controller_name: RNN_controller
  model_name: selftouch_contrastive_temporal

Test:
  loss_coef: &contrastive_loss
    contrastive: 0.0
    classification: 0.0
    tactile_index_tip: 3.0
    tactile_thumb_tip: 0.8
    tactile_middle_tip: 3.5
    tactile_loss: huber
    tactile_spread_mae_weight: 0.75
    tactile_active_weight: 0.35
    tactile_active_threshold_ratio: 0.08
    tactile_intensity_weight: 0.2
    tactile_intensity_gamma: 2.0
    tactile_contact_weight: 0.15
    tactile_contact_temperature: 0.08
    tactile_peak_weight: 0.35
    tactile_profile_weight: 0.15
    tactile_batch_profile_weight: 0.1
    tactile_centered_profile_weight: 0.05
    tactile_level_weight: 0.3
    tactile_derivative_weight: 0.75
    tactile_curvature_weight: 0.45
    tactile_shape_weight: 0.25
    tactile_highpass_weight: 0.75
    tactile_highpass_kernel: 9
    tactile_temporal_std_weight: 0.35
    tactile_delta_std_weight: 0.35
    tactile_topk_weight: 0.3
    tactile_topk_count: 12
    tactile_taxel_profile_weight: 0.35
    tactile_temporal_profile_weight: 0.25
    tactile_fair_loss: false
    tactile_curve_loss: false
    tactile_amplitude_weight: 0.2
    tactile_corr_weight: 0.1
    tactile_initial_weight: 1.0
    contrastive_temperature: 0.1
    tactile_huber_beta: 0.04
    tactile_mae_weight: 2.0
    tactile_contact_mae_weight: 0.75
    tactile_no_contact_mae_weight: 0.1
    tactile_contact_ratio: 0.12
    tactile_pinball_weight: 0.05
    tactile_pinball_quantile: 0.9
    tactile_finger_loss:
      index:
        tactile_contact_mae_weight: 1.0
        tactile_topk_weight: 0.45
        tactile_peak_weight: 0.5
      thumb:
        tactile_contact_mae_weight: 0.55
        tactile_topk_weight: 0.25
        tactile_peak_weight: 0.25
      middle:
        tactile_contact_mae_weight: 1.0
        tactile_topk_weight: 0.45
        tactile_peak_weight: 0.5
  model_load_path: /root/motionlearning/model_weight/selftouch_contrastive_temporal/parameter_base/epoch0.pth

Train:
  batch_size: 4
  train_micro_batch_size: 1
  lr: 3e-05
  lr_schedule:
    milestones:
    - 240
    - 360
    - 384
    factors:
    - 0.3
    - 0.1
    - 0.03
  weight_decay: 0.0
  grad_clip_norm: 1.0
  model_save_iter: 25
  eval_every: 1
  plot_every: 10
  use_amp: true
  torch_num_threads: 1
  eval_batch_size: 4
  eval_micro_batch_size: 1
  empty_cache_after_save: true
  empty_cache_after_eval: true
  cuda_memory_fraction: 0.10
  wandb_watch: false
  num_epochs: 400
  temperature: 0.1
  loss_coef: *contrastive_loss
  project: selftouch_contrastive_temporal
  wandb_entity: hasa-handresearch-waseda-university

  early_stop_enabled: false
  early_stop_monitor: total_loss
  early_stop_mode: min
  early_stop_patience: 70
  early_stop_min_delta: 0.002
  early_stop_min_epochs: 180
Pretrain:

Sweep:
  tune:
    Model:
      d_model:
        values: [128, 256]
      encoder_layers:
        values: [2, 4]
      decoder_layers:
        values: [2, 4]
      kernel_size:
        values: [5, 7, 9]
      dropout:
        values: [0.0, 0.02, 0.05]
      use_tactile_history:
        values:
        - true
      tactile_history_steps:
        values:
        - 3
        - 5
        - 8
      temporal_window_steps:
        values:
        - 1
        - 4
        - 8
      use_derived_features:
        values:
        - true
      use_joint_pos_only:
        values:
        - false
    Train:
      batch_size:
        values: [4]
      lr:
        distribution: log_uniform_values
        min: 3.0e-05
        max: 3.0e-04
      temperature:
        values: [0.07, 0.1, 0.2]
    Dataset:
      sequence_length:
        values:
        - 400
  method: random
  metric:
    name: tactile_line_raw_accuracy
    goal: maximize
  project: selftouch_contrastive_temporal
  wandb_entity: hasa-handresearch-waseda-university
